# Synthetic song for tests and demos: a 3/4 form with an extendable bridge and a repeatable
# last chorus. Not a real song; no private data.
kind: song
schema_version: 0
id: synthetic_waltz
title: Synthetic Waltz
tempo: { nominal: 96, range: [84, 108] }
meter: 3/4

sections:
  - { id: intro,   bars: 4 }
  - { id: verse1,  bars: 8, vocal: true, advance_on: { snapshot: 1 } }
  - { id: chorus1, bars: 8, vocal: true, advance_on: { snapshot: 2 } }
  - { id: bridge,  bars: 4, extendable: { unit: 2, prob: 0.4 }, advance_on: { snapshot: 3 } }
  - { id: verse2,  bars: 8, vocal: true, model_as: verse1, advance_on: { snapshot: 1 } }
  - { id: chorus2, bars: 8, vocal: true, model_as: chorus1, repeat: { max: 2, prob: 0.3 }, advance_on: { snapshot: 2 } }
  - { id: outro,   bars: 2, ends: true, advance_on: { snapshot: 4 } }

graph:
  - { from: bridge,  to: bridge,  prob: 0.4 }
  - { from: chorus2, to: chorus2, prob: 0.3 }

cues:
  - id: chorus_scene
    at: { section: chorus1, bar: 1, beat: 1 }
    class: standard
    state: { mvp.scene: chorus }
    on_miss: { fire_late_within_beats: 1 }

  - id: bridge_pad
    at: { section: bridge, bar: 1, beat: 1, offset_beats: -1 }
    class: decorative
    state: { aum.layer: chorus_pad }
    on_miss: skip
