name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: No audio or private paths tracked
        run: uv run python scripts/check_forbidden_paths.py
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pyright
      - run: uv run pytest
      - name: Working tree is clean after tests
        run: |
          status="$(git status --porcelain)"
          if [ -n "$status" ]; then
            echo "Tests left changes behind:"
            echo "$status"
            exit 1
          fi
